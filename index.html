<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meee Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>💬 Meee Messenger</h1>

        <div id="authScreen">
            <h2 id="formTitle">Create Account</h2>

            <form id="authForm">
                <input
                    type="text"
                    id="signupName"
                    placeholder="Your Name"
                    autocomplete="name"
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password (minimum 6 characters)"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >

                <button type="submit" id="submitBtn">
                    Sign Up
                </button>
            </form>

            <p id="authMessage" role="status"></p>

            <p id="switchText">
                Already have an account?
                <button type="button" id="switchBtn">Login</button>
            </p>
        </div>

        <div id="appScreen" hidden>
            <h2>Welcome to Meee!</h2>
            <p id="userInfo"></p>
            <button id="logoutBtn" type="button">Logout</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
